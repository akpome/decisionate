name: Dependency Security

on:
  schedule:
    - cron: "27 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.stack == 'api'
        with:
          python-version: "3.12"
      - name: Audit pinned Python packages
        if: matrix.stack == 'api'
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps --disable-pip -r apps/api/requirements.lock
      - uses: actions/setup-node@v4
        if: matrix.stack == 'web'
        with:
          node-version: "22"
      - name: Audit the npm lockfile
        if: matrix.stack == 'web'
        working-directory: apps/web
        run: npm audit --package-lock-only
