name: Release Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decisionate
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: decisionate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decisionate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:////tmp/decisionate-ci.db
      PYTHONDONTWRITEBYTECODE: "1"
      DECISIONATE_TEST_POSTGRES_URL: postgresql+psycopg://decisionate:test-only-password@127.0.0.1:5432/decisionate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r requirements.lock
      - run: pip check
      - run: python -B -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: https://api.example.test
      # A non-secret, syntactically valid fixture for prerendering only.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGVjaXNpb25hdGUuZXhhbXBsZS50ZXN0JA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
